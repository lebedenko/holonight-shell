name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Debug

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    container: ghcr.io/lebedenko/holonight-shell-ci:latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout HoloNightConfig dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 5cd36ec9986801c4b831527a38e7b7414b9a1312
          path: holonight-config-dep

      - name: Build and install HolonightConfig dependency
        run: |
          cmake -S holonight-config-dep -B holonight-config-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build holonight-config-dep/build --parallel
          cmake --install holonight-config-dep/build --prefix /usr
          rm -rf holonight-config-dep

      - name: Checkout holonight-qt dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: a45f7552054abbc6cbd66609e802b43b9b8ee894
          path: holonight-qt-dep

      - name: Build and install holonight-qt dependency
        run: |
          cmake -S holonight-qt-dep -B holonight-qt-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build holonight-qt-dep/build --parallel
          cmake --install holonight-qt-dep/build --prefix /tmp/holonight-qt-prefix
          rm -rf holonight-qt-dep

      - name: Checkout HoloNightSystemServices dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-system-services
          ref: 4556dc9b22237823387110340347cd1301ed9245
          path: holonight-system-services-dep

      - name: Build and install HoloNightSystemServices dependency
        run: |
          cmake -S holonight-system-services-dep -B holonight-system-services-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build holonight-system-services-dep/build --parallel
          cmake --install holonight-system-services-dep/build --prefix /tmp/holonight-system-services-prefix
          rm -rf holonight-system-services-dep

      - name: Architecture checks
        run: scripts/check-architecture-boundaries.sh

      - name: Configure
        run: >
          cmake -B build -G Ninja -S .
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_PREFIX_PATH=/tmp/holonight-qt-prefix\;/tmp/holonight-system-services-prefix
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: QML type metadata check
        run: scripts/check-qmltypes.sh build

      - name: Test
        run: dbus-run-session -- ctest --test-dir build --output-on-failure --no-tests=error

      - name: QML lint
        run: cmake --build build --target qml-lint

  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    container: ghcr.io/lebedenko/holonight-shell-ci:latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout HoloNightConfig dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 5cd36ec9986801c4b831527a38e7b7414b9a1312
          path: holonight-config-dep

      - name: Build and install HolonightConfig dependency
        run: |
          cmake -S holonight-config-dep -B holonight-config-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build holonight-config-dep/build --parallel
          cmake --install holonight-config-dep/build --prefix /usr
          rm -rf holonight-config-dep

      - name: Checkout holonight-qt dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: a45f7552054abbc6cbd66609e802b43b9b8ee894
          path: holonight-qt-dep

      - name: Build and install holonight-qt dependency
        run: |
          cmake -S holonight-qt-dep -B holonight-qt-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build holonight-qt-dep/build --parallel
          cmake --install holonight-qt-dep/build --prefix /tmp/holonight-qt-prefix
          rm -rf holonight-qt-dep

      - name: Checkout HoloNightSystemServices dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-system-services
          ref: 4556dc9b22237823387110340347cd1301ed9245
          path: holonight-system-services-dep

      - name: Build and install HoloNightSystemServices dependency
        run: |
          cmake -S holonight-system-services-dep -B holonight-system-services-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build holonight-system-services-dep/build --parallel
          cmake --install holonight-system-services-dep/build --prefix /tmp/holonight-system-services-prefix
          rm -rf holonight-system-services-dep

      - name: Configure
        run: >
          cmake -B build -G Ninja -S .
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_PREFIX_PATH=/tmp/holonight-qt-prefix\;/tmp/holonight-system-services-prefix
          -DBUILD_TESTS=ON

      - name: Format check
        run: cmake --build build --target format-check

      - name: Clang tidy
        run: cmake --build build --target tidy
