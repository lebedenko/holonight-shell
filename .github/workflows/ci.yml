name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  licensing:
    name: REUSE licensing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/run.py --lane licensing

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable user namespaces on the disposable runner
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: python3 scripts/ci/run.py --lane build-test
      - name: Preserve Controls acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controls-acceptance
          path: build/ci/*/artifacts/build-test/uqc-launch-logs

  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/run.py --lane static-checks
