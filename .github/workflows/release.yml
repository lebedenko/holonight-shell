name: Release

on:
  push:
    tags: ["v*"]

env:
  BUILD_TYPE: Debug

permissions:
  contents: write

jobs:
  # Build gate: the tag must compile, test, and lint cleanly before anything
  # is published. Mirrors the CI `build-test` job (same container and steps).
  build-gate:
    name: Build gate
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          scripts/install-ci-dependencies.sh
          apt-get install -y --no-install-recommends libpolkit-agent-1-dev libpolkit-qt6-1-dev

      - name: Checkout HoloNightConfig dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: fe69a59e6b73167fd5349223a4d265d75386c139
          path: holonight-config-dep

      - name: Build and install HolonightConfig dependency
        run: |
          cmake -S holonight-config-dep -B holonight-config-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build holonight-config-dep/build --parallel
          cmake --install holonight-config-dep/build --prefix $GITHUB_WORKSPACE/build-dependencies/prefix
          rm -rf holonight-config-dep

      - name: Checkout holonight-qt dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 00e6e208b6c9b30d89b66ef3aeb4ef8175050764
          path: holonight-qt-dep

      - name: Build and install holonight-qt dependency
        run: |
          cmake -S holonight-qt-dep -B holonight-qt-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_DEMO=OFF -DBUILD_CONTROLS_GALLERY=OFF -DBUILD_WAYLAND=ON -DHoloNightConfig_DIR=$GITHUB_WORKSPACE/build-dependencies/prefix/lib/cmake/HoloNightConfig
          cmake --build holonight-qt-dep/build --parallel
          cmake --install holonight-qt-dep/build --prefix $GITHUB_WORKSPACE/build-dependencies/prefix
          rm -rf holonight-qt-dep

      - name: Checkout HoloNightSystemServices dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-system-services
          ref: 4556dc9b22237823387110340347cd1301ed9245
          path: holonight-system-services-dep

      - name: Build and install HoloNightSystemServices dependency
        run: |
          cmake -S holonight-system-services-dep -B holonight-system-services-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build holonight-system-services-dep/build --parallel
          cmake --install holonight-system-services-dep/build --prefix $GITHUB_WORKSPACE/build-dependencies/prefix
          rm -rf holonight-system-services-dep

      - name: Configure
        run: >
          cmake -B build -G Ninja -S .
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/build-dependencies/prefix
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          # The Ubuntu host restricts user-namespace capabilities even in privileged
          # containers. This setting is confined to the disposable CI runner.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          useradd -m uqc
          runuser -u uqc -- bwrap --unshare-net --ro-bind / / -- true
          chown -R uqc:uqc "$GITHUB_WORKSPACE"
          runuser -u uqc -- python3 scripts/run-isolated-test.py --hide-host ctest --test-dir build --output-on-failure --no-tests=error

      - name: QML lint
        run: cmake --build build --target qml-lint

  # Publish: only runs if the build gate passed. Packages a source tarball
  # from the tag and creates the GitHub Release. Runs on the bare host runner
  # (not the container) so the preinstalled `git` and `gh` CLI are available.
  publish:
    name: Publish release
    needs: build-gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create source tarball
        run: >
          git archive
          --format=tar.gz
          --prefix="holonight-shell-${VERSION}/"
          -o "holonight-shell-${VERSION}.tar.gz"
          HEAD

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "holonight-shell-${VERSION}.tar.gz"
          --generate-notes
