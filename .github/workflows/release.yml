name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Build gate: the tag must compile, test, and lint cleanly before anything
  # is published. Uses the same integration command as the Acceptance workflow.
  build-gate:
    name: Build gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Container acceptance and Release integration
        run: python3 scripts/ci/container.py integration

  # Publish: only runs if the build gate passed. Packages a source tarball
  # from the tag and creates the GitHub Release. Runs on the bare host runner
  # (not the container) so the preinstalled `git` and `gh` CLI are available.
  publish:
    name: Publish release
    needs: build-gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create source tarball
        run: >
          git archive
          --format=tar.gz
          --prefix="holonight-shell-${VERSION}/"
          -o "holonight-shell-${VERSION}.tar.gz"
          HEAD

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "holonight-shell-${VERSION}.tar.gz"
          --generate-notes
