name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Build gate: the tag must compile, test, and lint cleanly before anything
  # is published. Mirrors the CI `build-test` job (same container and steps).
  build-gate:
    name: Build gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable user namespaces on the disposable runner
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Prepare exact providers and qualified images
        run: python3 scripts/ci/run.py --prepare
      - name: Offline tests, quality checks, licensing and Release staging
        run: python3 scripts/ci/run.py

  # Publish: only runs if the build gate passed. Packages a source tarball
  # from the tag and creates the GitHub Release. Runs on the bare host runner
  # (not the container) so the preinstalled `git` and `gh` CLI are available.
  publish:
    name: Publish release
    needs: build-gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create source tarball
        run: >
          git archive
          --format=tar.gz
          --prefix="holonight-shell-${VERSION}/"
          -o "holonight-shell-${VERSION}.tar.gz"
          HEAD

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "holonight-shell-${VERSION}.tar.gz"
          --generate-notes
