version: "3"

vars:
  BUILD_DIR: build
  RELEASE_BUILD_DIR: build-release
  LOCAL_INSTALL_BUILD_DIR: build-install-local
  SYSTEM_INSTALL_BUILD_DIR: build-install-system
  STAGE_BUILD_DIR: build-install-stage
  STAGE_DIR: '{{.TASKFILE_DIR}}/build-stage'
  LOCAL_INSTALL_PREFIX: '{{.HOME}}/.local'
  SYSTEM_INSTALL_PREFIX: /usr
  HOLONIGHT_QT_PREFIX: /tmp/holonight-qt-prefix
  HOLONIGHT_QT_DIR: /tmp/holonight-qt-prefix/lib/cmake/HolonightQt
  HOLONIGHT_APPEARANCE_CONFIG_PREFIX: /tmp/holonight-config-prefix
  HOLONIGHT_APPEARANCE_CONFIG_DIR: /tmp/holonight-config-prefix/lib/cmake/HoloNightConfig
  HOLONIGHT_SYSTEM_SERVICES_PREFIX: /tmp/holonight-system-services-prefix
  NPROC:
    sh: nproc

tasks:
  license-check:
    desc: Validate REUSE licensing and provenance metadata
    cmds:
      - reuse lint

  configure:
    desc: Configure CMake (debug, no tests)
    deps: [build:dependencies]
    cmds:
      - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF -DENABLE_COVERAGE=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH="{{.HOLONIGHT_QT_PREFIX}};{{.HOLONIGHT_APPEARANCE_CONFIG_PREFIX}};{{.HOLONIGHT_SYSTEM_SERVICES_PREFIX}}" -DHoloNightConfig_DIR={{.HOLONIGHT_APPEARANCE_CONFIG_DIR}} -DHolonightQt_DIR={{.HOLONIGHT_QT_DIR}} -S .
      - ln -sf {{.BUILD_DIR}}/compile_commands.json .

  configure:release:
    desc: Configure (Release)
    deps: [build:dependencies]
    cmds:
      - cmake -S . -B {{.RELEASE_BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DENABLE_COVERAGE=OFF -DCMAKE_PREFIX_PATH="{{.HOLONIGHT_QT_PREFIX}};{{.HOLONIGHT_APPEARANCE_CONFIG_PREFIX}};{{.HOLONIGHT_SYSTEM_SERVICES_PREFIX}}" -DHoloNightConfig_DIR={{.HOLONIGHT_APPEARANCE_CONFIG_DIR}} -DHolonightQt_DIR={{.HOLONIGHT_QT_DIR}}

  configure-tests:
    desc: Configure CMake with tests enabled
    deps: [build:dependencies]
    cmds:
      - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_COVERAGE=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH="{{.HOLONIGHT_QT_PREFIX}};{{.HOLONIGHT_APPEARANCE_CONFIG_PREFIX}};{{.HOLONIGHT_SYSTEM_SERVICES_PREFIX}}" -DHoloNightConfig_DIR={{.HOLONIGHT_APPEARANCE_CONFIG_DIR}} -DHolonightQt_DIR={{.HOLONIGHT_QT_DIR}} -S .
      - ln -sf {{.BUILD_DIR}}/compile_commands.json .

  configure-coverage:
    desc: Configure CMake with tests and coverage enabled
    deps: [build:dependencies]
    cmds:
      - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_COVERAGE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH="{{.HOLONIGHT_QT_PREFIX}};{{.HOLONIGHT_APPEARANCE_CONFIG_PREFIX}};{{.HOLONIGHT_SYSTEM_SERVICES_PREFIX}}" -DHoloNightConfig_DIR={{.HOLONIGHT_APPEARANCE_CONFIG_DIR}} -DHolonightQt_DIR={{.HOLONIGHT_QT_DIR}} -S .
      - ln -sf {{.BUILD_DIR}}/compile_commands.json .

  build:dependencies:
    desc: Build and install sibling dependencies
    cmds:
      - task: build:appearance-config-dependency
      - task: build:qt-dependency
      - task: build:system-services-dependency

  build:system-services-dependency:
    desc: Build and install the shared system services provider
    cmds:
      - cmake -S ../holonight-system-services -B ../holonight-system-services/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF
      - cmake --build ../holonight-system-services/build -j{{.NPROC}}
      - cmake --install ../holonight-system-services/build --prefix {{.HOLONIGHT_SYSTEM_SERVICES_PREFIX}}

  build:appearance-config-dependency:
    desc: Build and install the canonical appearance configuration provider
    cmds:
      - cmake -S ../holonight-config -B ../holonight-config/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF
      - cmake --build ../holonight-config/build -j{{.NPROC}}
      - cmake --install ../holonight-config/build --prefix {{.HOLONIGHT_APPEARANCE_CONFIG_PREFIX}}

  build:qt-dependency:
    desc: Build and install holonight-qt debug dependency to /tmp/holonight-qt-prefix
    cmds:
      - |
        if [ -d "../holonight-qt" ]; then
          cmake -S ../holonight-qt -B ../holonight-qt/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF -DBUILD_DEMO=OFF -DBUILD_CONTROLS_GALLERY=OFF -DBUILD_WAYLAND=ON -DHoloNightConfig_DIR="{{.HOLONIGHT_APPEARANCE_CONFIG_DIR}}"
          cmake --build ../holonight-qt/build -j{{.NPROC}}
          cmake --install ../holonight-qt/build --prefix {{.HOLONIGHT_QT_PREFIX}}
        else
          echo "Warning: holonight-qt not found at ../holonight-qt"
        fi

  build:
    desc: Build the project
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} -j{{.NPROC}}

  build:release:
    desc: Build (Release)
    deps: [configure:release]
    cmds:
      - cmake --build {{.RELEASE_BUILD_DIR}} -j{{.NPROC}}

  run:
    desc: Build and run holonight-shell
    deps: [build]
    env:
      QML_IMPORT_PATH: "{{.HOLONIGHT_QT_PREFIX}}/lib/qt6/qml"
      QML2_IMPORT_PATH: "{{.HOLONIGHT_QT_PREFIX}}/lib/qt6/qml"
    cmds:
      - ./{{.BUILD_DIR}}/holonight-shell

  install:build:
    internal: true
    desc: Build installable binaries against installed dependencies
    cmds:
      - cmake -S . -B "{{.INSTALL_BUILD_DIR}}" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DENABLE_COVERAGE=OFF -DCMAKE_INSTALL_PREFIX="{{.INSTALL_PREFIX}}" -DCMAKE_PREFIX_PATH="{{.INSTALL_PREFIX}}"
      - cmake --build "{{.INSTALL_BUILD_DIR}}" -j{{.NPROC}}

  install:local:
    desc: Build and install to ~/.local (installed HoloNight dependencies required)
    cmds:
      - task: install:build
        vars:
          INSTALL_BUILD_DIR: '{{.LOCAL_INSTALL_BUILD_DIR}}'
          INSTALL_PREFIX: '{{.LOCAL_INSTALL_PREFIX}}'
      - cmake --install "{{.LOCAL_INSTALL_BUILD_DIR}}"
      - task: install:reload

  install:
    desc: Build and install to ~/.local
    cmds:
      - task: install:local

  install:system:
    desc: Build and install to /usr (requires sudo and installed HoloNight dependencies)
    cmds:
      - task: install:build
        vars:
          INSTALL_BUILD_DIR: '{{.SYSTEM_INSTALL_BUILD_DIR}}'
          INSTALL_PREFIX: '{{.SYSTEM_INSTALL_PREFIX}}'
      - sudo cmake --install "{{.SYSTEM_INSTALL_BUILD_DIR}}"
      - task: install:reload

  install:stage:
    desc: Build and stage a system installation without sudo
    cmds:
      - task: install:build
        vars:
          INSTALL_BUILD_DIR: '{{.STAGE_BUILD_DIR}}'
          INSTALL_PREFIX: '{{.SYSTEM_INSTALL_PREFIX}}'
      - DESTDIR="{{.STAGE_DIR}}" cmake --install "{{.STAGE_BUILD_DIR}}"

  install:reload:
    internal: true
    cmds:
      - |
        if command -v systemctl >/dev/null && [ -z "${DESTDIR:-}" ]; then
          systemctl --user daemon-reload || echo "User systemd manager unavailable; units will be loaded at login."
        fi

  uninstall:
    desc: Remove files from the dedicated local install manifest
    prompt: Remove the HoloNight Shell files installed under {{.LOCAL_INSTALL_PREFIX}}?
    cmds:
      - python3 scripts/uninstall.py --manifest "{{.LOCAL_INSTALL_BUILD_DIR}}/install_manifest.txt" --prefix "{{.LOCAL_INSTALL_PREFIX}}" --delete
      - task: install:reload

  uninstall:system:
    desc: Remove files from the dedicated system install manifest
    prompt: Remove the HoloNight Shell files installed under {{.SYSTEM_INSTALL_PREFIX}}?
    cmds:
      - sudo python3 scripts/uninstall.py --manifest "{{.SYSTEM_INSTALL_BUILD_DIR}}/install_manifest.txt" --prefix "{{.SYSTEM_INSTALL_PREFIX}}" --delete
      - task: install:reload

  test:
    desc: Build with tests and run ctest
    deps: [configure-tests]
    cmds:
      - cmake --build {{.BUILD_DIR}} -j{{.NPROC}}
      - ctest --test-dir {{.BUILD_DIR}} --output-on-failure

  test:shell-config-package:
    desc: Build, install, and consume the standalone Shell product-config package
    cmds:
      - cmake -S libs/holonight-shell-config -B /tmp/holonight-shell-config-build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/tmp/holonight-shell-config-prefix
      - cmake --build /tmp/holonight-shell-config-build -j{{.NPROC}}
      - cmake --install /tmp/holonight-shell-config-build
      - cmake -S tests/shell-config-package-consumer -B /tmp/holonight-shell-config-consumer-build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=/tmp/holonight-shell-config-prefix
      - cmake --build /tmp/holonight-shell-config-consumer-build -j{{.NPROC}}
      - /tmp/holonight-shell-config-consumer-build/holonight-shell-config-consumer

  coverage:
    desc: Build with coverage and open HTML report
    deps: [configure-coverage]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target coverage
    generates:
      - "{{.BUILD_DIR}}/coverage/index.html"

  format:
    desc: Auto-format source files with clang-format
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target format

  format-check:
    desc: Check formatting without writing changes
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target format-check

  tidy:
    desc: Run clang-tidy
    deps: [configure-tests]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target tidy

  tidy-src:
    desc: Run clang-tidy on production sources
    deps: [configure-tests]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target tidy-src

  tidy-tests:
    desc: Run clang-tidy on tests
    deps: [configure-tests]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target tidy-tests

  tidy-container:
    desc: Run static checks inside the CI container (Docker/Podman) for predictable results
    cmds:
      - task: build:qt-dependency
      - |
        if command -v docker >/dev/null 2>&1; then
          CONTAINER_RUNNER="docker"
        elif command -v podman >/dev/null 2>&1; then
          CONTAINER_RUNNER="podman"
        else
          echo "ERROR: Neither docker nor podman is available." >&2
          exit 1
        fi
        $CONTAINER_RUNNER run --rm -v "$(pwd):/workspace" -v "/tmp/holonight-qt-prefix:/tmp/holonight-qt-prefix" -w /workspace ghcr.io/lebedenko/holonight-shell-ci:latest bash -c "
          rm -rf build-ci-check &&
          cmake -B build-ci-check -G Ninja -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH=/tmp/holonight-qt-prefix &&
          cmake --build build-ci-check --target format-check &&
          cmake --build build-ci-check --target tidy
        "

  build-ci-image:
    desc: Build the CI container image locally
    cmds:
      - |
        if command -v docker >/dev/null 2>&1; then
          CONTAINER_RUNNER="docker"
        elif command -v podman >/dev/null 2>&1; then
          CONTAINER_RUNNER="podman"
        else
          echo "ERROR: Neither docker nor podman is available." >&2
          exit 1
        fi
        $CONTAINER_RUNNER build -t ghcr.io/lebedenko/holonight-shell-ci:latest -f Dockerfile.ci .

  qml-lint:
    desc: Run qmllint on all QML files
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target qml-lint

  qmltypes-check:
    desc: Verify generated HolonightShell QML type metadata
    deps: [build]
    cmds:
      - scripts/check-qmltypes.sh {{.BUILD_DIR}}

  architecture-check:
    desc: Verify lightweight architecture boundaries
    cmds:
      - scripts/check-architecture-boundaries.sh

  compositor-smoke-check:
    desc: Print the live Hyprland compositor smoke checklist
    cmds:
      - bash scripts/hyprland-smoke-check.sh

  sway-runtime-smoke:
    desc: Run the Shell in a temporary headless Sway session
    deps: [build]
    cmds:
      - bash scripts/sway-runtime-smoke.sh build/holonight-shell

  clean:
    desc: Remove the build directory
    cmds:
      - rm -rf {{.BUILD_DIR}}
    prompt: Remove {{.BUILD_DIR}}/ entirely?

  clean-artifacts:
    desc: Remove ignored local build directories and root log files
    cmds:
      - scripts/clean-artifacts.sh --delete
    prompt: Remove ignored local build directories and root log files?

  screenshot:
    desc: Take a screenshot after a configurable delay (default 5s)
    cmds:
      - scripts/delayed-screenshot.sh {{.CLI_ARGS}}
