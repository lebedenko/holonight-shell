version: '3'
vars:
  BUILD_DIR: build/debug
  TEST_BUILD_DIR: build/test
  COVERAGE_BUILD_DIR: build/coverage
  RELEASE_BUILD_DIR: build/release
  LOCAL_INSTALL_BUILD_DIR: build/local-install
  SYSTEM_INSTALL_BUILD_DIR: build/system-install
  STAGE_BUILD_DIR: build/stage
  STAGE_DIR: '{{.TASKFILE_DIR}}/build-stage'
  LOCAL_INSTALL_PREFIX: '{{.HOME}}/.local'
  SYSTEM_INSTALL_PREFIX: /usr
  HOLONIGHT_QT_PREFIX: '{{default (printf "%s/build/deps/prefix" .TASKFILE_DIR) .HOLONIGHT_DEPENDENCY_PREFIX}}'
  HOLONIGHT_QT_DIR: '{{.TASKFILE_DIR}}/build/deps/prefix/lib/cmake/HolonightQt'
  HOLONIGHT_APPEARANCE_CONFIG_PREFIX: '{{default (printf "%s/build/deps/prefix" .TASKFILE_DIR) .HOLONIGHT_DEPENDENCY_PREFIX}}'
  HOLONIGHT_APPEARANCE_CONFIG_DIR: '{{.TASKFILE_DIR}}/build/deps/prefix/lib/cmake/HoloNightConfig'
  HOLONIGHT_SYSTEM_SERVICES_PREFIX: '{{default (printf "%s/build/deps/prefix" .TASKFILE_DIR) .HOLONIGHT_DEPENDENCY_PREFIX}}'
  NPROC:
    sh: nproc
  PRESET: '{{default "debug" .PRESET}}'
tasks:
  ci:
    desc: Rehearse every push validation lane in isolated pinned containers
    cmds:
    - python3 scripts/ci/run.py
  license-check:
    desc: Validate REUSE licensing and provenance metadata
    cmds:
    - reuse lint
  configure:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset {{.PRESET}}
  configure:release:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset release
  configure-tests:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset test
  configure-coverage:
    desc: Configure coverage preset
    cmds:
    - python3 tooling/workflow.py configure --preset coverage
  build:dependencies:
    desc: Prepare local providers
    cmds:
    - python3 tooling/workflow.py deps
  build:system-services-dependency:
    desc: deps using standalone tooling
    cmds:
    - python3 tooling/workflow.py deps
  build:appearance-config-dependency:
    desc: deps using standalone tooling
    cmds:
    - python3 tooling/workflow.py deps
  build:qt-dependency:
    desc: deps using standalone tooling
    cmds:
    - python3 tooling/workflow.py deps
  build:
    desc: build using standalone tooling
    cmds:
    - python3 tooling/workflow.py build --preset {{.PRESET}}
  build:release:
    desc: build using standalone tooling
    cmds:
    - python3 tooling/workflow.py build --preset release
  run:
    desc: Build and run holonight-shell
    deps:
    - build
    env:
      QML_IMPORT_PATH: '{{.HOLONIGHT_QT_PREFIX}}/lib/qt6/qml'
      QML2_IMPORT_PATH: '{{.HOLONIGHT_QT_PREFIX}}/lib/qt6/qml'
    cmds:
    - ./{{.BUILD_DIR}}/holonight-shell
  install:build:
    internal: true
    desc: Build installable binaries against installed dependencies
    cmds:
    - cmake -S . -B "{{.INSTALL_BUILD_DIR}}" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DENABLE_COVERAGE=OFF -DCMAKE_INSTALL_PREFIX="{{.INSTALL_PREFIX}}"
      -DCMAKE_PREFIX_PATH="{{.INSTALL_PREFIX}}"
    - cmake --build "{{.INSTALL_BUILD_DIR}}" -j{{.NPROC}}
  install:local:
    desc: Build and install to ~/.local (installed HoloNight dependencies required)
    cmds:
    - task: install:build
      vars:
        INSTALL_BUILD_DIR: '{{.LOCAL_INSTALL_BUILD_DIR}}'
        INSTALL_PREFIX: '{{.LOCAL_INSTALL_PREFIX}}'
    - cmake --install "{{.LOCAL_INSTALL_BUILD_DIR}}"
    - task: install:reload
  install:
    desc: Build and install to ~/.local
    cmds:
    - task: install:local
  install:system:
    desc: Build and install to /usr (requires sudo and installed HoloNight dependencies)
    cmds:
    - task: install:build
      vars:
        INSTALL_BUILD_DIR: '{{.SYSTEM_INSTALL_BUILD_DIR}}'
        INSTALL_PREFIX: '{{.SYSTEM_INSTALL_PREFIX}}'
    - sudo cmake --install "{{.SYSTEM_INSTALL_BUILD_DIR}}"
    - task: install:reload
  install:stage:
    desc: Build and stage a system installation without sudo
    cmds:
    - task: install:build
      vars:
        INSTALL_BUILD_DIR: '{{.STAGE_BUILD_DIR}}'
        INSTALL_PREFIX: '{{.SYSTEM_INSTALL_PREFIX}}'
    - DESTDIR="{{.STAGE_DIR}}" cmake --install "{{.STAGE_BUILD_DIR}}"
  install:reload:
    internal: true
    cmds:
    - "if command -v systemctl >/dev/null && [ -z \"${DESTDIR:-}\" ]; then\n  systemctl --user daemon-reload || echo \"User\
      \ systemd manager unavailable; units will be loaded at login.\"\nfi\n"
  uninstall:
    desc: Remove files from the dedicated local install manifest
    prompt: Remove the HoloNight Shell files installed under {{.LOCAL_INSTALL_PREFIX}}?
    cmds:
    - python3 scripts/uninstall.py --manifest "{{.LOCAL_INSTALL_BUILD_DIR}}/install_manifest.txt" --prefix "{{.LOCAL_INSTALL_PREFIX}}"
      --delete
    - task: install:reload
  uninstall:system:
    desc: Remove files from the dedicated system install manifest
    prompt: Remove the HoloNight Shell files installed under {{.SYSTEM_INSTALL_PREFIX}}?
    cmds:
    - sudo python3 scripts/uninstall.py --manifest "{{.SYSTEM_INSTALL_BUILD_DIR}}/install_manifest.txt" --prefix "{{.SYSTEM_INSTALL_PREFIX}}"
      --delete
    - task: install:reload
  test:
    desc: test using standalone tooling
    cmds:
    - python3 tooling/workflow.py test --preset {{.PRESET}}
  test:shell-config-package:
    desc: Build, install, and consume the standalone Shell product-config package
    cmds:
    - cmake -S libs/holonight-shell-config -B /tmp/holonight-shell-config-build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/tmp/holonight-shell-config-prefix
    - cmake --build /tmp/holonight-shell-config-build -j{{.NPROC}}
    - cmake --install /tmp/holonight-shell-config-build
    - cmake -S tests/shell-config-package-consumer -B /tmp/holonight-shell-config-consumer-build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      -DCMAKE_PREFIX_PATH=/tmp/holonight-shell-config-prefix
    - cmake --build /tmp/holonight-shell-config-consumer-build -j{{.NPROC}}
    - /tmp/holonight-shell-config-consumer-build/holonight-shell-config-consumer
  coverage:
    desc: Build coverage report
    cmds:
    - task: configure-coverage
    - cmake --build build/coverage --target coverage
  format:
    desc: format using standalone tooling
    cmds:
    - python3 tooling/workflow.py format
  format-check:
    desc: format-check using standalone tooling
    cmds:
    - python3 tooling/workflow.py format-check
  tidy:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope all
  tidy-src:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope src
  tidy-tests:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope tests
  tidy-container:
    desc: Run static checks inside the CI container (Docker/Podman) for predictable results
    cmds:
    - test "$(git -C ../holonight-config rev-parse HEAD)" = 03fa635cedc506e101a148fc54f7eb46d17c6de5
    - test "$(git -C ../holonight-qt rev-parse HEAD)" = d51194ea03c41881fb1099d313c806f869dc9051
    - test "$(git -C ../holonight-system-services rev-parse HEAD)" = 3e2928eb55bbc3de2b1e877e29aa57d47077c05d
    - "if command -v docker >/dev/null 2>&1; then\n  CONTAINER_RUNNER=\"docker\"\nelif command -v podman >/dev/null 2>&1;\
      \ then\n  CONTAINER_RUNNER=\"podman\"\nelse\n  echo \"ERROR: Neither docker nor podman is available.\" >&2\n  exit 1\n\
      fi\n$CONTAINER_RUNNER run --rm \\\n  -v \"$(pwd):/workspace\" \\\n  -v \"{{.TASKFILE_DIR}}/../holonight-config:/deps/config:ro\"\
      \ \\\n  -v \"{{.TASKFILE_DIR}}/../holonight-qt:/deps/qt:ro\" \\\n  -v \"{{.TASKFILE_DIR}}/../holonight-system-services:/deps/system-services:ro\"\
      \ \\\n  -w /workspace ghcr.io/lebedenko/holonight-shell-ci:latest bash -ec '\n    if ! pkg-config --exists polkit-qt6-agent-1\
      \ polkit-qt6-core-1; then\n      echo \"CI image lacks polkit-qt6 development packages required by the shell\" >&2\n\
      \      exit 1\n    fi\n    prefix=/workspace/build-ci-dependencies/prefix\n    cmake --fresh -S /deps/config -B build-ci-dependencies/config\
      \ -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=\"$prefix\"\n    cmake --build build-ci-dependencies/config\n\
      \    cmake --install build-ci-dependencies/config\n    cmake --fresh -S /deps/qt -B build-ci-dependencies/qt -G Ninja\
      \ -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF -DBUILD_DEMO=OFF -DBUILD_CONTROLS_GALLERY=OFF -DBUILD_WAYLAND=ON -DHoloNightConfig_DIR=\"\
      $prefix/lib/cmake/HoloNightConfig\" -DCMAKE_INSTALL_PREFIX=\"$prefix\"\n    cmake --build build-ci-dependencies/qt\n\
      \    cmake --install build-ci-dependencies/qt\n    cmake --fresh -S /deps/system-services -B build-ci-dependencies/system-services\
      \ -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=\"$prefix\"\n    cmake --build build-ci-dependencies/system-services\n\
      \    cmake --install build-ci-dependencies/system-services\n    cmake --fresh -S . -B build-ci-check -G Ninja -DCMAKE_BUILD_TYPE=Debug\
      \ -DPython3_EXECUTABLE=/usr/bin/python3 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH=\"$prefix\"\
      \ -DHoloNightConfig_DIR=\"$prefix/lib/cmake/HoloNightConfig\" -DHolonightQt_DIR=\"$prefix/lib/cmake/HolonightQt\" -DHoloNightSystemServices_DIR=\"\
      $prefix/lib/cmake/HoloNightSystemServices\"\n    cmake --build build-ci-check --target format-check\n    cmake --build\
      \ build-ci-check --target tidy\n  '\n"
  build-ci-image:
    desc: Build the CI container image locally
    cmds:
    - "if command -v docker >/dev/null 2>&1; then\n  CONTAINER_RUNNER=\"docker\"\nelif command -v podman >/dev/null 2>&1;\
      \ then\n  CONTAINER_RUNNER=\"podman\"\nelse\n  echo \"ERROR: Neither docker nor podman is available.\" >&2\n  exit 1\n\
      fi\n$CONTAINER_RUNNER build -t ghcr.io/lebedenko/holonight-shell-ci:latest -f Dockerfile.ci .\n"
  qml-lint:
    desc: Build and check QML with configured Qt installation
    cmds:
    - task: build
      vars:
        PRESET: test
    - cmake --build build/test --target qml-lint
  qmltypes-check:
    desc: Verify generated HolonightShell QML type metadata
    deps:
    - build
    cmds:
    - bash scripts/check-qmltypes.sh build/{{.PRESET}}
  architecture-check:
    desc: Verify lightweight architecture boundaries
    cmds:
    - scripts/check-architecture-boundaries.sh
  compositor-smoke-check:
    desc: Print the live Hyprland compositor smoke checklist
    cmds:
    - bash scripts/hyprland-smoke-check.sh
  labwc-runtime-smoke:
    desc: Verify workspace and window management, overview input, and shell restart in isolated labwc
    deps:
    - configure-tests
    cmds:
    - cmake --build {{.TEST_BUILD_DIR}} --target holonight-shell labwc_workspace_smoke labwc_protocol_smoke -j{{.NPROC}}
    - python3 scripts/run-isolated-test.py --hide-host bash scripts/labwc-runtime-smoke.sh {{.TEST_BUILD_DIR}}/holonight-shell
      {{.TEST_BUILD_DIR}}/tests/labwc_workspace_smoke
  sway-runtime-smoke:
    desc: Run the Shell in a temporary headless Sway session
    deps:
    - build
    cmds:
    - bash scripts/sway-runtime-smoke.sh build/holonight-shell
  clean:
    desc: Remove the build directory
    cmds:
    - rm -rf {{.BUILD_DIR}}
    prompt: Remove {{.BUILD_DIR}}/ entirely?
  clean-artifacts:
    desc: Remove ignored local build directories and root log files
    cmds:
    - scripts/clean-artifacts.sh --delete
    prompt: Remove ignored local build directories and root log files?
  screenshot:
    desc: Take a screenshot after a configurable delay (default 5s)
    cmds:
    - scripts/delayed-screenshot.sh {{.CLI_ARGS}}
  tooling:doctor:
    desc: doctor using standalone tooling
    cmds:
    - python3 tooling/workflow.py doctor
  tooling:refresh:
    desc: refresh using standalone tooling
    cmds:
    - python3 tooling/workflow.py refresh --preset {{default "test" .EDITOR_PRESET}}
  serena:serve:
    desc: Start independent Serena server in codex context
    cmds:
    - serena start-mcp-server --project "{{.TASKFILE_DIR}}" --context codex
  serena:index:
    desc: Explicitly index this module
    cmds:
    - serena project index "{{.TASKFILE_DIR}}"
  deps:
    desc: deps using standalone tooling
    cmds:
    - python3 tooling/workflow.py deps --preset {{.PRESET}}
  qml-import-check:
    desc: Check QML runtime import contracts
    cmds:
    - python3 scripts/check-qml-import-policy.py
  tooling:qmlls:
    desc: Start configured Qt language server with resolved import paths
    cmds:
    - python3 tooling/workflow.py qmlls
  lint:
    desc: Run C++ and QML lint
    cmds:
    - task: tidy
    - task: qml-lint
  check:
    desc: Run build, tests and static checks
    cmds:
    - task: build
    - task: test
    - task: format-check
    - task: lint
    - task: qml-import-check
    - task: qmltypes-check
