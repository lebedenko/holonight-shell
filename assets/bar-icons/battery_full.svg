<svg xmlns="http://www.w3.org/2000/svg" width="96" height="48" viewBox="0 0 96 48">

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7dcfff"/>
    <stop offset="55%" stop-color="#7aa2f7"/>
    <stop offset="100%" stop-color="#bb9af7"/>
  </linearGradient>
</defs>

<rect x="8" y="12" width="72" height="24" rx="5" fill="#161925" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
<rect x="82" y="19" width="6" height="10" rx="2" fill="#7dcfff"/>
<rect x="14" y="18" width="56" height="12" rx="3" fill="url(#neon)" opacity=".85"/>
<text x="42" y="27" text-anchor="middle" fill="#c0caf5" font-family="JetBrains Mono" font-size="8">82%</text>
</svg>